<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{font:16px system-ui,sans-serif;color:#172235;background:#f6f8fc;--line:#e2e8f0;--blue:#2359d8;--muted:#52637b}
    *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .bar,main{width:min(100% - 2rem,46rem);margin:auto}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:.75rem;min-height:68px}
    .brand,.with-icon,.product,.actions{display:flex;align-items:center;gap:.65rem}
    .brand{font-weight:750;letter-spacing:-.025em}
    .mark,.thumb{display:grid;place-items:center;flex:none;border-radius:13px;background:#eaf0ff;color:var(--blue)}
    .mark{width:38px;height:38px;background:var(--blue);color:#fff}
    .thumb{width:52px;height:52px;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .stock-number{flex:none;text-align:right}.stock-number strong{font-size:1.35rem;display:block}
    .movement{display:block;font-weight:650}.record-info{color:var(--muted)}
    .record-info summary{padding:.35rem 0;min-height:44px;font-size:.8rem}
    .label-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:0 .9rem}
    .buy-qty{flex:none;text-align:right;color:var(--blue)}
    .assignment{display:grid;grid-template-columns:1fr minmax(7rem,40%);gap:.6rem;align-items:center;padding:.2rem 0}
    .assignment input[type=number]{width:100%}.thumb svg{width:24px;height:24px}
    svg{width:19px;height:19px;flex:none}
    main{padding:1rem 0 6rem} h1,h2,p{margin:0 0 .75rem} h2{font-size:1.45rem;letter-spacing:-.035em}
    #account,small,.muted{color:var(--muted);font-size:.875rem}
    nav{display:flex;gap:.25rem;margin:0 0 1rem;padding:.35rem;background:#fff;border:1px solid var(--line);border-radius:15px}
    nav:empty{display:none} nav button{flex:1;border:0;display:flex;justify-content:center;align-items:center;gap:.4rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
    nav button[aria-current=page]{color:var(--blue);background:#edf2ff;font-weight:700}
    button,input,select{font:inherit;min-height:44px;border:1px solid #c6d1df;border-radius:10px;padding:.55rem .75rem;color:inherit;background:#fff}
    button{min-width:44px;cursor:pointer} button:disabled{opacity:.55;cursor:default}
    :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .full{justify-content:center}
    .primary{color:#fff;background:var(--blue);border-color:var(--blue);font-weight:700}
    .actions{flex-wrap:wrap;margin:.75rem 0}
    #factoryField{margin:0 0 .8rem;color:var(--muted);font-size:.875rem}
    input[type=checkbox]{width:22px;min-height:0;height:22px;accent-color:var(--blue)}
    label{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;margin:.55rem 0}
    label input:not([type=checkbox]),label select{width:100%}
    .card,.list,.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:1rem;margin:.55rem 0}
    .list{padding:0 1rem}.item{display:flex;align-items:center;justify-content:space-between;gap:.65rem;padding:.75rem 0;overflow-wrap:anywhere}
    .item + .item{border-top:1px solid var(--line)}
    .product{min-width:0}.product strong{display:block}.product small{display:block;margin-top:.2rem}
    .stepper{display:flex;align-items:center;gap:.15rem;flex:none}
    .stepper button{border-radius:50%;padding:0;font-size:1.25rem;color:var(--blue)}
    .stepper input{width:3.5rem;text-align:center;padding:.1rem;border-color:transparent;appearance:textfield}
    .stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{appearance:none}
    #search,.full{width:100%;margin:.25rem 0 .6rem}
    #message{color:#166534}#message:empty{display:none}#message.error{color:#b91c1c}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.metric{margin:0}.metric strong{display:block;font-size:1.6rem;margin-top:.28rem}
    .metric.warning strong{color:#a43a15}.section-title{font-size:1rem;margin:1.1rem 0 .45rem}
    details summary{cursor:pointer;min-height:44px;padding:.6rem 0;font-weight:650}
    dialog{width:min(32rem,calc(100% - 2rem));border:1px solid var(--line);border-radius:15px;padding:1rem;color:inherit}dialog::backdrop{background:#1e293b88}
    #signOut{font-size:.85rem}
    @media(max-width:560px){
      nav{position:fixed;bottom:0;left:0;right:0;z-index:2;margin:0;border-radius:0;padding:.25rem .45rem max(.4rem,env(safe-area-inset-bottom))}
      nav button{flex-direction:column;font-size:.72rem;gap:.2rem;padding:.25rem .15rem;min-height:50px}
      .metric{padding:.65rem}.thumb{width:42px;height:42px}.thumb svg{width:19px;height:19px}
      .list{padding:0 .65rem}.item{gap:.4rem}.stepper input{width:2.6rem}.product{gap:.45rem}
    }
  </style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><span id="brandIcon" class="mark"></span><span data-text="appName">Smart Stock</span></div>
  <div class="with-icon"><span id="account"></span><button id="signOut" data-text="signOut" type="button" hidden>Sign out</button></div>
</div></header>
<main>
  <label id="factoryField" style="display:none" hidden><span data-text="factory">Factory</span> <select id="factory"></select></label>
  <nav id="navigation" aria-label="Main"></nav>
  <p id="message" role="status" aria-live="polite">Loading…</p>
  <section id="page"></section>
  <section class="card" id="login" hidden>
    <h2 data-text="signIn">Sign in</h2>
    <form id="loginForm">
      <label><span data-text="username">Username</span> <input id="username" autocomplete="username" required></label>
      <label><span data-text="password">Password</span> <input id="password" type="password" autocomplete="current-password" required></label>
      <button id="signIn" data-text="signIn" class="primary">Sign in</button>
    </form>
    <p><button id="ownerLogin" data-text="adminSignIn" type="button">Admin sign in</button></p>
  </section>
</main>
<dialog id="confirmation">
  <h2 data-text="confirm">Confirm</h2>
  <ul id="summary"></ul>
  <div class="actions"><button id="confirm" data-text="confirm" class="primary">Confirm</button><button id="cancel" data-text="cancel">Cancel</button></div>
</dialog>
<script>
const byId = id => document.getElementById(id);
const page = byId('page');
const factory = byId('factory');
const dialog = byId('confirmation');
let token = '';
let account, current = 'Home', sequence = 0, pending = null, submitting = false;
const rpc = (name, ...args) => new Promise((resolve, reject) => {
  const run = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
  if (['start', 'factoryItems', 'stockOverview', 'stockSummary', 'itemImage', 'history', 'postStock'].includes(name)) {
    run[name](...args, token);
  } else {
    run[name](...args);
  }
});
let wording = {defaults:{}, overrides:{}};
const label = (key, fallback) => wording.overrides[key] ?? wording.defaults[key] ?? fallback;
function applyWording(update) {
  wording = update;
  document.title = label('appName', 'Smart Stock');
  for (const node of document.querySelectorAll('[data-text]')) {
    node.textContent = label(node.dataset.text, node.textContent);
  }
}
const wordingReady = rpc('interfaceText').then(applyWording).catch(() => {});
function el(tag, text = '', className = '') {
  const node = document.createElement(tag);
  node.textContent = text;
  node.className = className;
  return node;
}
function button(text, action, style = '') {
  const node = el('button', text, style);
  node.type = 'button';
  node.onclick = action;
  return node;
}
function message(text, error = false) {
  byId('message').textContent = text;
  byId('message').className = error ? 'error' : '';
}
function failure(error) {
  const text = (error?.message || '').replace(/^Exception: |^Error: /, '');
  const publicErrors = [
    'Access denied.', 'Invalid request.', 'Please contact your supervisor.',
    'Check the quantity. Some items require whole numbers.', 'Item unavailable.',
    'System busy. Retry the same request.', 'This item already has stock history.',
    'Check the required fields.', 'Invalid pack size.', 'Check the email and role.',
    'Select assigned factories.', 'Keep your administrator account active.',
    'Enter a username.', 'Enter a password.', 'Enter a new password when changing the username.',
    'Could not prepare the password. Reopen the web app in a current browser and try again.',
    'Choose Worker or Supervisor.',
    'Username already exists. Select that user to edit or reset their password.',
    'An existing inventory balance uses decimals.', 'Stock limit reached.',
    'Check the factory assignments.', 'Check the factory assignments and daily usage estimates.',
    'Enter a whole number of workers, or leave it blank.',
    'Enter a valid daily usage per worker, or leave it blank.',
    'Check the interface text.', 'Choose a valid item photo.', 'Could not open that photo. Try a JPG or PNG.'
  ];
  message(publicErrors.includes(text) ? text : 'Could not complete the request. Retry from this page.', true);
}
const paths = {
  box:'M21 8l-9 5-9-5m9 5v9M3 8v9l9 5 9-5V8l-9-5z',
  use:'M12 4v16M4 12h16',
  history:'M4 12a8 8 0 1 1 2 5m-2 0v-5h5m3-4v4l3 2',
  home:'M3 10l9-7 9 7v10H3zm6 10v-6h6v6',
  more:'M4 6h16M4 12h16M4 18h16',
  factory:'M3 21V10l6-4v5l6-4v4l6-4v14zM7 16h1m4 0h1m4 0h1',
  check:'m5 12 4 4L19 6',
  soap:'M9 3h8m-6 0v5m-4 0h8v3l2 3v6H5v-6l2-3zm-2 7h12',
  paper:'M6 3h9l4 4v14H6zm8 0v5h5M9 13h7m-7 4h7',
  bag:'M9 4h6l-2 4 6 8v4H5v-4l6-8zm1 4h4',
  roll:'M4 7a4 4 0 1 1 8 0v10a3 3 0 1 1-6 0v-2m-2-8h15a2 2 0 0 1 2 2v8H9',
};
function icon(name) {
  const namespace = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(namespace, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.7');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(namespace, 'path');
  path.setAttribute('d', paths[name]);
  svg.append(path);
  return svg;
}
byId('brandIcon').append(icon('box'));
function iconButton(label, symbol, action, style = '') {
  const control = button(label, action, 'with-icon ' + style);
  control.prepend(icon(symbol));
  return control;
}
function routes() {
  if (account.role === 'WORKER') {
    return [[label('useNow', 'Use now'),'use','Use Item'], [label('history', 'History'),'history','My History']];
  }
  const links = [[label('home','Home'),'home','Home'], [label('stock','Stock'),'box','Stock'],
    [label('history','History'),'history','Team History']];
  if (account.role === 'ADMIN') links.push([label('manage','Manage'),'more','Manage']);
  return links;
}
function activeRoute(name) {
  if (name.endsWith('History')) return account.role === 'WORKER' ? 'My History' : 'Team History';
  if (account.role !== 'WORKER' && ['Stock','Stock In','Opening Stock','Use Item'].includes(name)) return 'Stock';
  return name;
}
function productIcon(name) {
  if (/toilet|tissue|roll/i.test(name)) return 'roll';
  if (/soap|saniti[sz]er/i.test(name)) return 'soap';
  if (/bag|liner/i.test(name)) return 'bag';
  if (/paper|ream/i.test(name)) return 'paper';
  return 'box';
}
const photoObserver = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    photoObserver.unobserve(entry.target);
    const thumb = entry.target;
    rpc('itemImage', thumb.dataset.item, thumb.dataset.factory).then(source => {
      if (!source || !thumb.isConnected) return;
      const image = el('img');
      image.alt = '';
      image.onload = () => thumb.replaceChildren(image);
      image.src = source;
    }).catch(() => {});
  }
});
function product(name, detail, symbol = productIcon(name), photo = null) {
  const row = el('div', '', 'product');
  const thumb = el('span', '', 'thumb');
  const text = el('div');
  thumb.append(icon(symbol));
  if (photo?.hasPhoto) {
    thumb.dataset.item = photo.id;
    thumb.dataset.factory = photo.factory ?? factory.value;
    photoObserver.observe(thumb);
  }
  text.append(el('strong', name));
  if (detail) text.append(el('small', detail));
  row.append(thumb, text);
  return row;
}
function renderBuy(result) {
  const section = el('section');
  section.append(el('h3', label('buy', 'Suggested Buy'), 'section-title'));
  function draw(factoryId) {
    const list = el('div', '', 'list');
    const matches = result.recommendations.filter(row => !factoryId || row.factory === factoryId);
    for (const row of matches) {
      const line = el('div', '', 'item');
      const note = [row.factoryName, 'In stock: ' + row.quantity,
        row.daysLeft === null ? '' : row.daysLeft + ' days left', row.basis].filter(Boolean).join(' · ');
      const amount = el('div', '', 'buy-qty');
      amount.append(el('small', 'Buy'), el('strong', row.suggested + ' ' + row.unit));
      line.append(product(row.name, note, productIcon(row.name), row), amount);
      list.append(line);
    }
    results.replaceChildren(matches.length ? list : el('p', 'No purchase suggestions for this view.', 'muted'));
  }
  const results = el('div');
  if (account.factories.length > 1) {
    const filter = el('select');
    filter.setAttribute('aria-label', 'Suggested Buy factory');
    filter.append(new Option('All factories', ''), ...account.factories.map(row => new Option(row.name, row.id)));
    filter.onchange = () => draw(filter.value);
    section.append(filter);
  }
  section.append(results);
  if (result.insufficient) {
    section.append(el('p', result.insufficient + ' stock items need more usage history or a daily estimate.', 'muted'));
  }
  if (result.missingWorkerCount) {
    section.append(el('p', result.missingWorkerCount + ' stock items need a worker count in Manage → Factories.', 'muted'));
  }
  draw('');
  page.append(section);
}

function renderSummary(summary) {
  const cards = el('div', '', 'metrics');
  for (const [label, value, style] of [
    ['Factories', summary.length, ''],
    ['Stock items', summary.reduce((sum, row) => sum + row.items, 0), ''],
    ['Out of stock', summary.reduce((sum, row) => sum + row.empty, 0), 'warning']
  ]) {
    const card = el('div', '', 'metric ' + style);
    card.append(el('small', label), el('strong', String(value)));
    cards.append(card);
  }
  page.append(cards, el('h3', 'Factory overview', 'section-title'));
  if (!summary.length) page.append(el('p', 'No active factories yet.', 'muted'));
  if (summary.length) {
    const list = el('div', '', 'list');
    for (const entry of summary) {
      const row = el('div', '', 'item');
      row.append(product(entry.name, entry.items + ' stock items · ' + entry.empty + ' out of stock', 'factory'),
        button(label('stock', 'Stock'), () => { factory.value = entry.id; openPage('Stock'); }));
      list.append(row);
    }
    page.append(list);
  }
}
async function openPage(name) {
  if (submitting) return;
  current = name;
  const version = ++sequence;
  byId('navigation').replaceChildren(...routes().map(([caption, symbol, route]) => {
    const control = iconButton(caption, symbol, () => openPage(route));
    if (route === activeRoute(name)) control.setAttribute('aria-current', 'page');
    return control;
  }));
  const title = {
    Home:label('dashboard','Stock overview'), 'Use Item':label('useNow','Use now'),
    Stock:label('stock','Stock'), Manage:label('manage','Manage'),
    'Stock In':label('receive','Receive'), 'Opening Stock':label('opening','Opening stock'),
    'My History':label('myHistory','My history'), 'Team History':label('teamHistory','Team history')
  }[name];
  page.replaceChildren(el('h2', title));
  byId('factoryField').hidden = !account.factories.length || ['Home', 'Manage'].includes(name);
  message('');
  try {
    if (name === 'Home') {
      message('Loading…');
      const [summary, buy] = await Promise.all([
        rpc('stockSummary'),
        account.role === 'ADMIN' ? rpc('suggestedBuy').catch(() => null) : null
      ]);
      if (version === sequence) {
        renderSummary(summary);
        if (buy) renderBuy(buy);
        else if (account.role === 'ADMIN') page.append(el('p', 'Suggested Buy could not load. Try reopening Home.', 'muted'));
        message('');
      }
      return;
    }
    if (name !== 'Manage' && !factory.value) {
      message('No factory assigned. Please contact your supervisor.', true);
      return;
    }
    message('Loading…');
    if (name === 'Manage') {
      const data = await rpc('catalog');
      if (version === sequence) renderCatalog(data);
    } else if (name === 'Stock') {
      const items = await rpc('stockOverview', factory.value);
      if (version === sequence) {
        const actions = el('div', '', 'actions');
        actions.append(iconButton(label('useNow','Use now'),'use',() => openPage('Use Item')),
          iconButton(label('receive','Receive'),'box',() => openPage('Stock In')));
        if (account.role === 'ADMIN') actions.append(button(label('opening','Opening stock'), () => openPage('Opening Stock')));
        page.append(actions);
        renderStock(items);
      }
    } else if (name.endsWith('History')) {
      if (account.role !== 'WORKER') {
        const actions = el('div', '', 'actions');
        actions.append(button(name === 'Team History' ? label('myHistory','My history') : label('teamHistory','Team history'),
          () => openPage(name === 'Team History' ? 'My History' : 'Team History')));
        page.append(actions);
      }
      const rows = await rpc('history', factory.value, name === 'Team History');
      if (version === sequence) renderHistory(rows);
    } else {
      const items = await rpc('factoryItems', factory.value);
      if (version === sequence) renderEntry(items, {'Use Item':'USE','Stock In':'RECEIVE','Opening Stock':'OPENING'}[name]);
    }
    if (version === sequence) message('');
  } catch (error) {
    if (version === sequence) failure(error);
  }
}
function readableUnit(value) {
  const unit = String(value ?? '').trim();
  return /\p{L}/u.test(unit) ? unit : '';
}
function displayQuantity(quantity, unit) {
  return [String(quantity), readableUnit(unit)].filter(Boolean).join(' ');
}
function renderStock(items) {
  if (!items.length) {
    page.append(el('p', label('noItems','No items yet.'), 'muted'));
    return;
  }
  const list = el('div', '', 'list');
  for (const item of items) {
    const row = el('div', '', 'item');
    const quantity = el('div', '', 'stock-number');
    quantity.append(el('strong', displayQuantity(item.quantity, item.unit)),
      el('small', label('onHand','On hand')));
    row.append(product(item.name, '', productIcon(item.name), item), quantity);
    list.append(row);
  }
  page.append(list);
}
function displayDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
  const date = new Date(value + 'T00:00:00Z');
  return Number.isNaN(date.getTime()) ? value :
    new Intl.DateTimeFormat('en-GB', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'}).format(date);
}
function renderHistory(records) {
  if (!records.length) {
    page.append(el('p', label('noHistory','No records yet.'), 'muted'));
    return;
  }
  const list = el('div', '', 'list');
  const actions = {USE:label('used','Used'), RECEIVE:label('received','Received'), OPENING:label('opening','Opening stock')};
  for (const record of records) {
    const row = el('div', '', 'item');
    row.append(product(record.name, displayDate(record.date)));
    const info = el('div', '', 'stock-number');
    const action = actions[record.type] || label('used','Used');
    info.append(el('span', action + ' ' + displayQuantity(record.quantity, record.unit), 'movement'));
    if (record.before !== undefined) {
      const details = el('details', '', 'record-info');
      details.append(el('summary','Stock change'), el('small', String(record.before) + ' → ' + String(record.after)));
      info.append(details);
    }
    row.append(info);
    list.append(row);
  }
  page.append(list);
}
function renderEntry(items, type) {
  if (!items.length) {
    page.append(el('p', label('noItems','No items yet.')));
    return;
  }
  const values = new Map();
  const search = el('input');
  search.id = 'search';
  search.type = 'search';
  search.placeholder = label('search','Search items');
  search.setAttribute('aria-label', search.placeholder);
  const list = el('div', '', 'list');
  const save = iconButton(label('save','Save'), 'check', () => {
    const lines = items.map(item => ({item:item.id, quantity:Number(values.get(item.id) || 0)}))
      .filter(line => line.quantity !== 0);
    if (!lines.length || lines.some(line => !Number.isFinite(line.quantity) || line.quantity < 0)) {
      message('Enter a positive quantity.', true);
      return;
    }
    const payload = {type, factory:factory.value, lines};
    const signature = JSON.stringify(payload);
    if (pending?.signature !== signature) {
      pending = {signature, payload:{...payload, request:crypto.randomUUID()}};
    }
    byId('summary').replaceChildren(...lines.map(line => {
      const item = items.find(row => row.id === line.item);
      return el('li', item.name + ' · ' + displayQuantity(line.quantity, item.unit));
    }));
    dialog.showModal();
    byId('confirm').onclick = async () => {
      if (submitting) return;
      submitting = true;
      byId('confirm').disabled = true;
      byId('cancel').disabled = true;
      message('Saving…');
      try {
        await rpc('postStock', pending.payload);
        pending = null;
        values.clear();
        paint();
        message(label('saved','Saved!'));
      } catch (error) {
        failure(error);
      } finally {
        submitting = false;
        byId('confirm').disabled = false;
        byId('cancel').disabled = false;
        dialog.close();
      }
    };
  }, 'primary full');
  function paint() {
    const query = search.value.trim().toLowerCase();
    list.replaceChildren(...items.filter(item => item.name.toLowerCase().includes(query)).map(item => {
      const row = el('div', '', 'item');
      const itemName = product(item.name, readableUnit(item.unit), productIcon(item.name), item);
      const input = el('input');
      input.type = 'number';
      input.inputMode = 'decimal';
      input.min = '0';
      input.step = 'any';
      input.value = values.get(item.id) ?? '0';
      input.setAttribute('aria-label', item.name + ' quantity');
      input.oninput = () => values.set(item.id, input.value || '0');
      function step(delta) {
        input.value = String(Math.max(0, Math.round(((Number(input.value) || 0) + delta) * 1e6) / 1e6));
        input.oninput();
      }
      const minus = button('−', () => step(-1));
      const plus = button('+', () => step(1));
      minus.setAttribute('aria-label', 'Decrease ' + item.name);
      plus.setAttribute('aria-label', 'Increase ' + item.name);
      const controls = el('div', '', 'stepper');
      controls.append(minus, input, plus);
      row.append(itemName, controls);
      return row;
    }));
  }
  search.oninput = paint;
  paint();
  page.append(search, list, save);
}
async function thumbnail(file) {
  if (file.size > 20 * 1024 * 1024) throw new Error('Choose a valid item photo.');
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 300 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = el('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', .78);
  } catch (error) {
    throw new Error('Could not open that photo. Try a JPG or PNG.');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function interfaceSettings() {
  const card = el('details', '', 'card');
  card.id = 'interfaceSettings';
  card.name = 'manage';
  card.append(el('summary', 'Interface text'));
  const fields = {
    appName:'App name', factory:'Factory picker', signIn:'Sign-in button', adminSignIn:'Admin sign-in button',
    signOut:'Sign-out button', username:'Username field', password:'Password field',
    useNow:'Use menu', history:'History menu', home:'Home menu', stock:'Stock menu', manage:'Manage menu',
    dashboard:'Dashboard title', buy:'Suggested Buy title', myHistory:'My history title',
    teamHistory:'Team history title', receive:'Receive button', opening:'Opening stock button',
    search:'Search field', save:'Save button', confirm:'Confirm button', cancel:'Cancel button',
    saved:'Saved message', used:'Used label', received:'Received label', onHand:'Stock quantity label',
    noItems:'Empty item list', noHistory:'Empty history'
  };
  const form = el('form');
  const grid = el('div', '', 'label-grid');
  form.append(el('p', 'Leave a field blank to use the default.', 'muted'), grid);
  for (const [key, title] of Object.entries(fields)) {
    const wrapper = el('label', title);
    const input = el('input');
    input.name = key;
    input.maxLength = 80;
    input.value = wording.overrides[key] ?? '';
    input.placeholder = wording.defaults[key] ?? '';
    wrapper.append(input);
    grid.append(wrapper);
  }
  const save = el('button', label('save','Save'), 'primary');
  form.append(save);
  card.append(form);
  form.onsubmit = async event => {
    event.preventDefault();
    save.disabled = true;
    const currentAccount = account;
    try {
      const result = await rpc('saveInterfaceText', Object.fromEntries(new FormData(form)));
      if (account !== currentAccount) return;
      applyWording(result);
      if (current === 'Manage') {
        await openPage('Manage');
        if (account === currentAccount && byId('interfaceSettings')) byId('interfaceSettings').open = true;
      }
      if (account === currentAccount) message(label('saved','Saved!'));
    } catch (error) {
      if (account === currentAccount) failure(error);
    } finally {
      save.disabled = false;
    }
  };
  return card;
}

function renderCatalog(data) {
  const kinds = {FACTORIES:'Factories', ITEMS:'Items', USERS:'User accounts'};
  for (const [kind, title] of Object.entries(kinds)) {
    if (kind === 'USERS') page.append(interfaceSettings());
    const card = el('details', '', 'card');
    card.name = 'manage';
    const editor = el('div');
    const picker = el('select');
    picker.setAttribute('aria-label', title);
    picker.append(new Option('New', ''));
    for (const [index, row] of data[kind].entries()) {
      const description = kind === 'USERS' ? row.username : row.name;
      picker.append(new Option(description, String(index)));
    }
    function edit() {
      const row = picker.value === '' ? {} : data[kind][Number(picker.value)];
      const fields = {};
      const itemAssignments = [];
      const form = el('form');
      function field(key, label, type, initial, options = []) {
        const input = el(type === 'select' ? 'select' : 'input');
        if (type === 'select') options.forEach(([id, name]) => input.append(new Option(name, id)));
        else input.type = type;
        if (type === 'checkbox') input.checked = initial === true;
        else input.value = initial ?? '';
        fields[key] = input;
        const wrapper = el('label', label);
        wrapper.append(input);
        form.append(wrapper);
      }
      if (kind !== 'USERS') field('name','Name','text',row.name);
      if (kind === 'FACTORIES') {
        field('workerCount','Number of workers','number',row.workerCount);
        fields.workerCount.min = '0';
        fields.workerCount.max = '1000000';
        fields.workerCount.step = '1';
        fields.workerCount.placeholder = 'e.g. 50';
      }
      if (kind === 'ITEMS') {
        field('unit','Unit (e.g. roll, bottle)','text',row.unit);
        field('pack','Pack size','number',row.pack ?? 1);
        fields.pack.step = 'any';
        field('decimal','Allow decimals','checkbox',row.decimal);
        field('usagePerWorker','Estimated units per worker per day','number',row.usagePerWorker);
        fields.usagePerWorker.min = '0';
        fields.usagePerWorker.max = '1000000';
        fields.usagePerWorker.step = 'any';
        fields.usagePerWorker.placeholder = 'e.g. 0.2';
        form.append(el('p', 'Fill this in to use worker counts for this item. Leave it blank to use usage history or factory estimates.', 'muted'));
        field('photo', row.hasPhoto ? 'Replace photo' : 'Upload photo', 'file', '');
        fields.photo.accept = 'image/*';
        if (row.hasPhoto) form.append(product(row.name, 'Current photo', productIcon(row.name), {...row, factory:''}));
        form.append(el('h3', 'Assigned factories', 'section-title'),
          el('p', 'Select factories. Units / day is the whole factory estimate when worker-based usage and history are unavailable.', 'muted'));
        const factories = data.FACTORIES.filter(entry => entry.active);
        if (!factories.length) form.append(el('p', 'Create an active factory under Factories first.', 'muted'));
        factories.forEach(entry => {
          const existing = data.STOCK.find(stock => stock.item === row.id && stock.factory === entry.id);
          const line = el('div', '', 'assignment');
          const label = el('label', entry.name);
          const assigned = el('input');
          const daily = el('input');
          assigned.type = 'checkbox';
          assigned.checked = existing?.active === true;
          daily.type = 'number';
          daily.min = '0';
          daily.step = 'any';
          daily.placeholder = 'Units / day';
          daily.value = existing?.estimatedDaily ?? '';
          daily.disabled = !assigned.checked;
          daily.setAttribute('aria-label', entry.name + ' estimated units per day');
          assigned.onchange = () => { daily.disabled = !assigned.checked; };
          label.prepend(assigned);
          line.append(label, daily);
          form.append(line);
          itemAssignments.push({factory:entry.id, assigned, daily});
        });
      }
      if (kind === 'USERS') {
        field('username','Username','text',row.username);
        fields.username.required = true;
        fields.username.autocomplete = 'off';
        fields.username.autocapitalize = 'none';
        fields.username.spellcheck = false;
        field('password',row.id ? 'New password' : 'Password','password','');
        fields.password.autocomplete = 'new-password';
        fields.password.required = !row.id;
        if (row.id) form.append(el('p', 'Leave the password blank to keep it. Enter a new password if you change the username.', 'muted'));
        field('role','Role','select',row.role || 'WORKER',[['WORKER','Worker'],['SUPERVISOR','Supervisor']]);
        const activeFactories = data.FACTORIES.filter(f => f.active);
        form.append(el('h3', 'Assigned factories', 'section-title'));
        if (!activeFactories.length) form.append(el('p', 'Create an active factory under Factories first.', 'muted'));
        for (const f of activeFactories) {
          field('factory:' + f.id, f.name, 'checkbox', row.factories?.includes(f.id));
        }
      }
      field('active','Active','checkbox',row.active ?? true);
      const save = el('button',label('save','Save'),'primary');
      form.append(save);
      form.onsubmit = async event => {
        event.preventDefault();
        save.disabled = true;
        const input = {id:row.id || '', factories:[]};
        for (const [key, node] of Object.entries(fields)) {
          if (key === 'photo' || key === 'password') continue;
          if (key.startsWith('factory:')) {
            if (node.checked) input.factories.push(key.slice(8));
          } else if (key === 'workerCount' || key === 'usagePerWorker') {
            input[key] = node.value === '' ? '' : Number(node.value);
          } else input[key] = node.type === 'checkbox' ? node.checked : node.type === 'number' ? Number(node.value) : node.value;
        }
        if (kind === 'USERS' && input.active && !input.factories.length) {
          message('Select at least one factory for this user.', true);
          save.disabled = false;
          return;
        }
        const editorAccount = account;
        try {
          if (kind === 'ITEMS') {
            input.itemFactories = itemAssignments.filter(entry => entry.assigned.checked).map(entry => ({
              factory:entry.factory, estimatedDaily:entry.daily.value === '' ? '' : Number(entry.daily.value)
            }));
            if (fields.photo.files[0]) input.photo = await thumbnail(fields.photo.files[0]);
            if (account !== editorAccount) return;
          }
          if (kind === 'USERS' && fields.password.value) {
            input.passwordProof = await preparePassword(input.username, fields.password.value);
            if (account !== editorAccount) return;
          }
          await rpc('saveCatalog', kind, input);
          if (account !== editorAccount) return;
          if (kind === 'FACTORIES') {
            const next = await rpc('start');
            if (account !== editorAccount) return;
            populate(next);
          }
          await openPage('Manage');
          message(label('saved','Saved!'));
        } catch (error) {
          failure(error);
        } finally {
          save.disabled = false;
        }
      };
      editor.replaceChildren(form);
    }
    picker.onchange = edit;
    edit();
    card.append(el('summary', title), picker, editor);
    page.append(card);
  }
}
function populate(value) {
  const selection = factory.value;
  account = value;
  byId('account').textContent = account.name;
  factory.replaceChildren(...account.factories.map(row => new Option(row.name,row.id)));
  if (account.factories.some(row => row.id === selection)) factory.value = selection;
  byId('factoryField').style.display = account.factories.length ? '' : 'none';
  byId('factoryField').hidden = !account.factories.length;
}
byId('cancel').onclick = () => dialog.close();
dialog.oncancel = event => { if (submitting) event.preventDefault(); };
factory.onchange = () => openPage(current);
async function preparePassword(username, password) {
  if (!username.trim()) throw new Error('Enter a username.');
  if (!password) throw new Error('Enter a password.');
  try {
    const deploymentSalt = await rpc('passwordSalt');
    if (!deploymentSalt) throw new Error('Missing deployment salt');
    const encoder = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']);
    const salt = encoder.encode(deploymentSalt + ':' + username.normalize('NFKC').trim().toLowerCase());
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', iterations:600000, salt}, baseKey, 256);
    return 'v2:' + Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
  } catch (error) {
    throw new Error('Could not prepare the password. Reopen the web app in a current browser and try again.');
  }
}

function loggedOut(text = '') {
  token = '';
  pending = null;
  byId('password').value = '';
  byId('summary').replaceChildren();
  if (dialog.open) dialog.close();
  account = undefined;
  ++sequence;
  page.replaceChildren();
  byId('navigation').replaceChildren();
  byId('factoryField').style.display = 'none';
  byId('account').textContent = '';
  byId('signOut').hidden = true;
  byId('login').hidden = false;
  message(text, Boolean(text));
}
async function enter() {
  await wordingReady;
  populate(await rpc('start'));
  byId('login').hidden = true;
  byId('signOut').hidden = false;
  return openPage(account.role === 'WORKER' ? 'Use Item' : 'Home');
}
byId('ownerLogin').onclick = async () => {
  byId('ownerLogin').disabled = byId('signIn').disabled = true;
  try {
    await enter();
  } catch (error) {
    loggedOut('Open the app with the Google account used to deploy it.');
  } finally {
    byId('ownerLogin').disabled = byId('signIn').disabled = false;
  }
};
byId('loginForm').onsubmit = async event => {
  event.preventDefault();
  byId('ownerLogin').disabled = byId('signIn').disabled = true;
  try {
    const username = byId('username').value;
    const password = byId('password').value;
    const proof = await preparePassword(username, password);
    const legacyPassword = /^[0-9a-f]{32}$/.test(password) ? password : '';
    token = await rpc('signIn', username, proof, legacyPassword);
    await enter();
  } catch (error) {
    loggedOut('Sign-in failed. Check your username and password and try again.');
  } finally {
    byId('password').value = '';
    byId('ownerLogin').disabled = byId('signIn').disabled = false;
  }
};
byId('signOut').onclick = async () => {
  if (submitting) return;
  const currentToken = token;
  loggedOut();
  if (currentToken) await rpc('signOut', currentToken).catch(() => {});
};
loggedOut();
</script>
